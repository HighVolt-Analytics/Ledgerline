name: Read-only Hostinger path diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_host_key_fingerprint:
        description: SHA256 fingerprint verified in Hostinger before dispatch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hostinger-readonly-diagnostic
  cancel-in-progress: false

jobs:
  discover:
    name: Read-only SSH discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configured connection
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_TARGET_PATH: ${{ secrets.HOSTINGER_TARGET_PATH }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          EXPECTED_HOST_KEY_FINGERPRINT: ${{ inputs.expected_host_key_fingerprint }}
        run: |
          set -euo pipefail
          [[ "$HOSTINGER_HOST" == "92.113.28.62" ]]
          [[ "$HOSTINGER_PORT" == "65002" ]]
          [[ "$HOSTINGER_USERNAME" == "u359614291" ]]
          [[ -n "$HOSTINGER_TARGET_PATH" && "$HOSTINGER_TARGET_PATH" != *..* && "$HOSTINGER_TARGET_PATH" != *$'\n'* && "$HOSTINGER_TARGET_PATH" != *$'\r'* ]]
          [[ -n "$HOSTINGER_SSH_KEY" ]]
          [[ "$EXPECTED_HOST_KEY_FINGERPRINT" == SHA256:* ]]
          echo "Configured host, port, username, target-path format, and SSH key are present. Secret values are not printed."

      - name: Pin the Hostinger SSH host key
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          EXPECTED_HOST_KEY_FINGERPRINT: ${{ inputs.expected_host_key_fingerprint }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          ssh-keyscan -T 10 -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" > "$RUNNER_TEMP/scanned-host-keys"
          : > "$RUNNER_TEMP/hostinger_known_hosts"
          matched=0
          while read -r scanned_host key_type key_data; do
            [[ -n "${key_data:-}" ]] || continue
            printf '%s %s %s\n' "$scanned_host" "$key_type" "$key_data" > "$RUNNER_TEMP/candidate-host-key"
            fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/candidate-host-key" -E sha256 | awk '{print $2}')"
            if [[ "$fingerprint" == "$EXPECTED_HOST_KEY_FINGERPRINT" ]]; then
              printf '%s %s %s\n' "$scanned_host" "$key_type" "$key_data" >> "$RUNNER_TEMP/hostinger_known_hosts"
              matched=1
            fi
          done < "$RUNNER_TEMP/scanned-host-keys"
          if [[ "$matched" != 1 ]]; then
            echo "No scanned host key matched the fingerprint supplied from Hostinger. No SSH connection was made."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/hostinger_known_hosts"
          echo "Host key matched the supplied Hostinger fingerprint."

      - name: Classify the configured target (read-only)
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_TARGET_PATH: ${{ secrets.HOSTINGER_TARGET_PATH }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$HOSTINGER_SSH_KEY" > "$RUNNER_TEMP/hostinger_key"
          chmod 600 "$RUNNER_TEMP/hostinger_key"
          SSH_OPTS=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/hostinger_known_hosts" -o ConnectTimeout=15 -i "$RUNNER_TEMP/hostinger_key" -p "$HOSTINGER_PORT")
          printf -v TARGET_PATH_Q '%q' "$HOSTINGER_TARGET_PATH"
          ssh "${SSH_OPTS[@]}" "$HOSTINGER_USERNAME@$HOSTINGER_HOST" "TARGET_PATH=$TARGET_PATH_Q bash -s" <<'REMOTE_READ_ONLY'
          set -eu
          case "$TARGET_PATH" in
            /*) ;;
            *) TARGET_PATH="$HOME/$TARGET_PATH" ;;
          esac
          case "$TARGET_PATH" in
            "$HOME"/*) ;;
            *) echo "Configured target is outside the SSH home; stopping."; exit 1 ;;
          esac
          case "$TARGET_PATH" in
            *..*|*$'\n'*|*$'\r'*) echo "Configured target contains an invalid path component; stopping."; exit 1 ;;
          esac
          if [ ! -d "$TARGET_PATH" ]; then
            echo "Configured target is not an existing directory; stopping."
            exit 1
          fi
          resolved_home="$(readlink -f -- "$HOME" 2>/dev/null)" || { echo "SSH home could not be resolved; stopping."; exit 1; }
          resolved_target="$(readlink -f -- "$TARGET_PATH" 2>/dev/null)" || { echo "Configured target could not be resolved; stopping."; exit 1; }
          case "$resolved_target" in
            "$resolved_home"/*) TARGET_PATH="$resolved_target" ;;
            *) echo "Configured target resolves outside the SSH home; stopping."; exit 1 ;;
          esac
          target_class=other_or_unknown
          case "$TARGET_PATH" in
            "$resolved_home/domains/quantumledgerlink.com/public_html") target_class=quantumledgerlink.com ;;
            "$resolved_home/domains/quantumledgerline.com/public_html") target_class=quantumledgerline.com ;;
          esac
          printf 'configured_target_class=%s\n' "$target_class"
          printf 'configured_target_exists=yes\n'
          if ! target_permissions="$(stat -c '%a' -- "$TARGET_PATH" 2>/dev/null)"; then
            echo "Configured target permissions could not be read; stopping."
            exit 1
          fi
          printf 'configured_target_permissions=%s\n' "$target_permissions"
          if [ -r "$TARGET_PATH" ]; then printf 'configured_target_readable=yes\n'; else printf 'configured_target_readable=no\n'; fi
          if [ -w "$TARGET_PATH" ]; then printf 'configured_target_writable_by_ssh_user=yes\n'; else printf 'configured_target_writable_by_ssh_user=no\n'; fi
          if [ -e "$TARGET_PATH/.htaccess" ]; then printf 'configured_target_has_htaccess=yes\n'; else printf 'configured_target_has_htaccess=no\n'; fi
          if [ -e "$TARGET_PATH/api" ]; then printf 'configured_target_has_api=yes\n'; else printf 'configured_target_has_api=no\n'; fi
          REMOTE_READ_ONLY
          rm -f "$RUNNER_TEMP/hostinger_key" "$RUNNER_TEMP/hostinger_known_hosts" "$RUNNER_TEMP/candidate-host-key" "$RUNNER_TEMP/scanned-host-keys"
