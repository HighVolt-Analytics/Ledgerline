name: Deploy to Hostinger

run-name: Deploy Quantum Ledgerline by ${{ inputs.deployer_email || github.actor }}

on:
  workflow_dispatch:
    inputs:
      deployer_email:
        description: "Email of the user who triggered deployment"
        required: false
        default: "unknown"
      deployer_name:
        description: "Name of the user who triggered deployment"
        required: false
        default: "unknown"
      triggered_from:
        description: "Source system"
        required: false
        default: "GitHub"
  push:
    branches:
      - main

concurrency:
  group: deploy-quantum-ledgerline-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Quantum Ledgerline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build project
        run: npm run build

      - name: Add deployment marker
        env:
          DEPLOYER_EMAIL: ${{ inputs.deployer_email || github.actor }}
          DEPLOYER_NAME: ${{ inputs.deployer_name || github.actor }}
          TRIGGERED_FROM: ${{ inputs.triggered_from || 'GitHub' }}
        run: |
          echo "Deployed from GitHub Actions" > dist/deploy-info.txt
          echo "Website: Quantum Ledgerline" >> dist/deploy-info.txt
          echo "Domain: quantumledgerlink.com" >> dist/deploy-info.txt
          echo "Commit: $GITHUB_SHA" >> dist/deploy-info.txt
          echo "Time UTC: $(date -u)" >> dist/deploy-info.txt
          echo "Deployed by: $DEPLOYER_EMAIL" >> dist/deploy-info.txt
          echo "Deployer name: $DEPLOYER_NAME" >> dist/deploy-info.txt
          echo "Triggered from: $TRIGGERED_FROM" >> dist/deploy-info.txt

      - name: Validate Hostinger secrets
        run: |
          if [ -z "${{ secrets.HOSTINGER_HOST }}" ]; then
            echo "Missing secret: HOSTINGER_HOST"
            exit 1
          fi

          if [ -z "${{ secrets.HOSTINGER_PORT }}" ]; then
            echo "Missing secret: HOSTINGER_PORT"
            exit 1
          fi

          if [ -z "${{ secrets.HOSTINGER_USERNAME }}" ]; then
            echo "Missing secret: HOSTINGER_USERNAME"
            exit 1
          fi

          if [ -z "${{ secrets.HOSTINGER_TARGET_PATH }}" ]; then
            echo "Missing secret: HOSTINGER_TARGET_PATH"
            exit 1
          fi

          if [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ]; then
            echo "Missing secret: HOSTINGER_SSH_KEY"
            exit 1
          fi

          echo "All required Hostinger secrets are present"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          ssh-keyscan -T 20 -p "${{ secrets.HOSTINGER_PORT }}" "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Test SSH connection with retry
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=45 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/hostinger_key -p ${{ secrets.HOSTINGER_PORT }}"

          for attempt in 1 2 3 4 5; do
            echo "SSH connection attempt $attempt of 5"

            if ssh $SSH_OPTS "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" "echo SSH connection successful"; then
              echo "SSH connection verified"
              exit 0
            fi

            echo "SSH connection failed. Waiting before retry..."
            sleep 30
          done

          echo "SSH connection failed after 5 attempts"
          exit 1

      - name: Backup existing public_html
        continue-on-error: true
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=45 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/hostinger_key -p ${{ secrets.HOSTINGER_PORT }}"

          for attempt in 1 2 3; do
            echo "Backup attempt $attempt of 3"

            if ssh $SSH_OPTS "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" "mkdir -p ~/deployment_backups/quantumledgerlink.com && tar -czf ~/deployment_backups/quantumledgerlink.com/backup-$(date +%Y%m%d-%H%M%S).tar.gz -C '${{ secrets.HOSTINGER_TARGET_PATH }}' . || true"; then
              echo "Backup completed"
              exit 0
            fi

            echo "Backup failed. Waiting before retry..."
            sleep 20
          done

          echo "Backup skipped after retry attempts"
          exit 0

      - name: Clean old website files safely
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=45 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/hostinger_key -p ${{ secrets.HOSTINGER_PORT }}"

          for attempt in 1 2 3 4 5; do
            echo "Clean attempt $attempt of 5"

            if ssh $SSH_OPTS "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" "find '${{ secrets.HOSTINGER_TARGET_PATH }}' -mindepth 1 -maxdepth 1 ! -name '.htaccess' ! -name 'api' -exec rm -rf {} +"; then
              echo "Remote clean completed"
              exit 0
            fi

            echo "Remote clean failed. Waiting before retry..."
            sleep 30
          done

          echo "Remote clean failed after 5 attempts"
          exit 1

      - name: Upload dist to Hostinger
        run: |
          SCP_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=45 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/hostinger_key -P ${{ secrets.HOSTINGER_PORT }}"

          for attempt in 1 2 3 4 5; do
            echo "Upload attempt $attempt of 5"

            if scp $SCP_OPTS -r dist/* "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_TARGET_PATH }}/"; then
              echo "Upload completed"
              exit 0
            fi

            echo "Upload failed. Waiting before retry..."
            sleep 30
          done

          echo "Upload failed after 5 attempts"
          exit 1

      - name: Verify remote deployment
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=45 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/hostinger_key -p ${{ secrets.HOSTINGER_PORT }}"

          for attempt in 1 2 3 4 5; do
            echo "Verify attempt $attempt of 5"

            if ssh $SSH_OPTS "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" "cd '${{ secrets.HOSTINGER_TARGET_PATH }}' && pwd && ls -lah && echo '--- deploy marker ---' && cat deploy-info.txt"; then
              echo "Verification completed"
              exit 0
            fi

            echo "Verification failed. Waiting before retry..."
            sleep 30
          done

          echo "Verification failed after 5 attempts"
          exit 1

      - name: Deployment completed
        run: echo "Quantum Ledgerline deployed successfully"

      - name: Send deployment success email
        uses: dawidd6/action-send-mail@v3
        if: success()
        continue-on-error: true
        with:
          server_address: ${{ secrets.MAIL_HOST }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: 'Deployment Success: Quantum Ledgerline'
          body: |
            Website: Quantum Ledgerline
            Domain: quantumledgerlink.com
            Status: Success
            Deployed by: ${{ inputs.deployer_email || github.actor }}
            Deployer name: ${{ inputs.deployer_name || github.actor }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Triggered from: ${{ inputs.triggered_from || 'GitHub' }}
            GitHub run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send deployment failure email
        uses: dawidd6/action-send-mail@v3
        if: failure()
        continue-on-error: true
        with:
          server_address: ${{ secrets.MAIL_HOST }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: 'Deployment Failed: Quantum Ledgerline'
          body: |
            Website: Quantum Ledgerline
            Domain: quantumledgerlink.com
            Status: Failed
            Deployed by: ${{ inputs.deployer_email || github.actor }}
            Deployer name: ${{ inputs.deployer_name || github.actor }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Triggered from: ${{ inputs.triggered_from || 'GitHub' }}
            GitHub run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Message: Open the GitHub run URL for full logs.
