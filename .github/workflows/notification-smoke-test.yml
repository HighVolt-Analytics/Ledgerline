name: Microsoft Graph notification smoke test

on:
  workflow_dispatch:
    inputs:
      outcome:
        description: Notification outcomes to simulate; no deployment is performed
        required: true
        type: choice
        options:
          - both
          - success
          - failure
        default: both

permissions:
  contents: read

jobs:
  smoke-test:
    name: Send simulated notification email
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out main without a persisted token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Send requested simulated notifications
        env:
          MAIL_TENANT_ID: ${{ vars.MAIL_TENANT_ID }}
          MAIL_CLIENT_ID: ${{ vars.MAIL_CLIENT_ID }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMOKE_OUTCOME: ${{ inputs.outcome }}
        run: python scripts/send-notification-smoke.py
