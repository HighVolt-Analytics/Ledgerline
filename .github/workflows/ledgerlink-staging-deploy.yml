name: LedgerLink Staging Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  ACR_REGISTRY: highvoltacr1778087855.azurecr.io
  ACR_NAME: highvoltacr1778087855
  NAMESPACE: quantum-ledgerlink
  API_IMAGE: highvoltacr1778087855.azurecr.io/ledgerlink-api
  FRONTEND_IMAGE: highvoltacr1778087855.azurecr.io/ledgerlink-frontend
  # Matches backend/Dockerfile (uvicorn --port 8000). Local dev uses host 8001 via docker-compose.
  API_CONTAINER_PORT: "8000"
  FRONTEND_CONTAINER_PORT: "80"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ledgerlink-staging
      url: https://staging.highvolt.tech/ledgerlink
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push API image
        run: |
          docker build \
            -t "${{ env.API_IMAGE }}:${{ github.sha }}" \
            -t "${{ env.API_IMAGE }}:latest" \
            ./backend
          docker push "${{ env.API_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.API_IMAGE }}:latest"

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg VITE_BASE_PATH=/ledgerlink/ \
            --build-arg VITE_API_BASE=/ledgerlink/api \
            -t "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            -t "${{ env.FRONTEND_IMAGE }}:latest" \
            ./frontend
          docker push "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.FRONTEND_IMAGE }}:latest"

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Ensure namespace
        run: |
          kubectl create namespace "${{ env.NAMESPACE }}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/ -n "${{ env.NAMESPACE }}"

      - name: Update deployment images
        run: |
          kubectl set image deployment/ledgerlink-api \
            ledgerlink-api="${{ env.API_IMAGE }}:${{ github.sha }}" \
            -n "${{ env.NAMESPACE }}"

          kubectl set image deployment/ledgerlink-worker \
            ledgerlink-worker="${{ env.API_IMAGE }}:${{ github.sha }}" \
            -n "${{ env.NAMESPACE }}"

          kubectl set image deployment/ledgerlink-beat \
            ledgerlink-beat="${{ env.API_IMAGE }}:${{ github.sha }}" \
            -n "${{ env.NAMESPACE }}"

          kubectl set image deployment/ledgerlink-frontend \
            ledgerlink-frontend="${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            -n "${{ env.NAMESPACE }}"

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/ledgerlink-api -n "${{ env.NAMESPACE }}" --timeout=10m
          kubectl rollout status deployment/ledgerlink-worker -n "${{ env.NAMESPACE }}" --timeout=10m
          kubectl rollout status deployment/ledgerlink-beat -n "${{ env.NAMESPACE }}" --timeout=10m
          kubectl rollout status deployment/ledgerlink-frontend -n "${{ env.NAMESPACE }}" --timeout=10m

      - name: Verify API health on container port
        run: |
          kubectl exec -n "${{ env.NAMESPACE }}" deploy/ledgerlink-api -- \
            wget -qO- "http://127.0.0.1:${{ env.API_CONTAINER_PORT }}/health"
