# Run API + Celery against Azure Postgres / Redis (no local postgres or redis containers).
# Requires backend/.env with POSTGRES_HOST, REDIS_HOST, and other Azure secrets.
#
#   docker compose -f docker-compose.azure.yml up -d --build
#   docker compose -f docker-compose.azure.yml logs -f worker

services:
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      UPLOAD_DIR: /app/uploads
      RULE_BOOK_CONFIG_PATH: /app/app/rule_book_config.json
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      CELERY_WORKER: "1"
      UPLOAD_DIR: /app/uploads
      RULE_BOOK_CONFIG_PATH: /app/app/rule_book_config.json
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads

  beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      CELERY_WORKER: "1"
    volumes:
      - ./backend:/app

volumes:
  upload_data:
