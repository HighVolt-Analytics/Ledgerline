apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerlink-frontend
  namespace: quantum-ledgerlink-prod
  labels:
    app: ledgerlink-frontend
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledgerlink-frontend
  template:
    metadata:
      labels:
        app: ledgerlink-frontend
        component: frontend
    spec:
      imagePullSecrets:
        - name: acr-auth
      containers:
        - name: ledgerlink-frontend
          image: highvoltacr1778087855.azurecr.io/ledgerlink-frontend:placeholder
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
