apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerlink-api
  namespace: quantum-ledgerlink-prod
  labels:
    app: ledgerlink-api
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledgerlink-api
  template:
    metadata:
      labels:
        app: ledgerlink-api
        component: api
    spec:
      imagePullSecrets:
        - name: acr-auth
      containers:
        - name: ledgerlink-api
          image: highvoltacr1778087855.azurecr.io/ledgerlink-api:placeholder
          imagePullPolicy: Always
          command:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8001"
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: ledgerlink-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
