apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerlink-worker
  namespace: quantum-ledgerlink
  labels:
    app: ledgerlink-worker
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledgerlink-worker
  template:
    metadata:
      labels:
        app: ledgerlink-worker
        component: worker
    spec:
      imagePullSecrets:
        - name: acr-auth
      containers:
        - name: ledgerlink-worker
          image: highvoltacr1778087855.azurecr.io/ledgerlink-api:placeholder
          imagePullPolicy: Always
          command:
            - sh
            - -c
            # Env-specific queue (ledgerlink.staging / ledgerlink.production) so a
            # shared Redis broker cannot let prod steal staging invoice jobs.
            - >
              Q=$(python -c "from app.config import get_settings; print(get_settings().celery_task_queue_resolved)")
              && exec celery -A app.workers.celery_app worker
              --loglevel=info --concurrency=1 --prefetch-multiplier=1 -Q "$Q"
          env:
            - name: CELERY_WORKER
              value: "1"
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: ledgerlink-config
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - app.workers.celery_app
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.workers.celery_app
                - inspect
                - ping
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
