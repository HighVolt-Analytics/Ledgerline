# API listens on container port 8000 (backend/Dockerfile: uvicorn --port 8000, EXPOSE 8000).
# Port 8001 appears only in local dev/docker-compose host mappings (8001:8000).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerlink-api
  namespace: quantum-ledgerlink
  labels:
    app: ledgerlink-api
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledgerlink-api
  template:
    metadata:
      labels:
        app: ledgerlink-api
        component: api
    spec:
      imagePullSecrets:
        - name: acr-auth
      containers:
        - name: ledgerlink-api
          image: highvoltacr1778087855.azurecr.io/ledgerlink-api:placeholder
          imagePullPolicy: Always
          # Image CMD: uvicorn app.main:app --host 0.0.0.0 --port 8000
          ports:
            - name: http
              containerPort: 8000          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: ledgerlink-config
          # FastAPI exposes GET /health at the app root (not under /api).
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
