# Service port 8000 matches the API container (uvicorn in backend/Dockerfile).
# Local README/docker-compose use host port 8001 mapped to container 8000.
apiVersion: v1
kind: Service
metadata:
  name: ledgerlink-api  namespace: quantum-ledgerlink
  labels:
    app: ledgerlink-api
spec:
  type: ClusterIP
  selector:
    app: ledgerlink-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ledgerlink-frontend
  namespace: quantum-ledgerlink
  labels:
    app: ledgerlink-frontend
spec:
  type: ClusterIP
  selector:
    app: ledgerlink-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
