# Example ConfigMap for namespace quantum-ledgerlink.
# Apply after filling non-secret values: kubectl apply -f k8s/ledgerlink-config.example.yaml
# Do not commit real secrets — use app-secrets for sensitive keys.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledgerlink-config
  namespace: quantum-ledgerlink
data:
  BASE_PATH: "/ledgerlink"
  APP_ENV: "preview"
  PAYMENT_ENVIRONMENT_LABEL: "Preview"
  PUBLIC_APP_BASE_URL: "https://staging.highvolt.tech/ledgerlink"
  PUBLIC_API_BASE_URL: "https://staging.highvolt.tech/ledgerlink/api"
  POSTGRES_HOST: "<your-postgres-host>"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "<your-db-name>"
  POSTGRES_USER: "<your-db-user>"
  REDIS_HOST: "<your-redis-host>"
  REDIS_SSL_PORT: "6380"
  UPLOAD_DIR: "/app/uploads"
  RULE_BOOK_CONFIG_PATH: "/app/app/rule_book_config.json"
  CHART_OF_ACCOUNTS_PATH: "/app/app/chart_of_accounts.json"
  CORS_ORIGINS: "https://staging.highvolt.tech"
  AZURE_WEBAPP_URL: "https://staging.highvolt.tech/ledgerlink"
  PUBLIC_APP_URL: "https://staging.highvolt.tech/ledgerlink"
  GRAPH_OAUTH_REDIRECT_URI: "https://staging.highvolt.tech/ledgerlink/api/mailboxes/oauth/callback"
  GRAPH_OAUTH_FRONTEND_RETURN_URL: "https://staging.highvolt.tech/ledgerlink/integrations"
  LOG_LEVEL: "INFO"
  AUTH_REQUIRED: "true"
  STRIPE_MODE: "sandbox"
  STRIPE_RETURN_URL: "https://staging.highvolt.tech/ledgerlink/payments"
  STRIPE_REFRESH_URL: "https://staging.highvolt.tech/ledgerlink/payments"
  STRIPE_OAUTH_REDIRECT_URL: "https://staging.highvolt.tech/ledgerlink/payments/stripe/oauth/callback"
  # Production safety — keep false until live cutover is explicitly approved
  STRIPE_PAYMENTS_EXECUTION_ENABLED: "false"
  STRIPE_LIVE_PAYMENTS_ENABLED: "false"
  STRIPE_GLOBAL_PAYOUTS_ENABLED: "false"
  STRIPE_GLOBAL_PAYOUTS_ACCESS_STATUS: "not_requested"
  STRIPE_GLOBAL_PAYOUTS_MAX_AMOUNT_USD: "1000"
  STRIPE_GLOBAL_PAYOUTS_SUPPORTED_COUNTRIES: "AU"
  STRIPE_GLOBAL_PAYOUTS_SUPPORTED_CURRENCIES: "AUD,USD"
  # Manual instruction orchestration for staging dry-run (no real Stripe payouts)
  PAYMENT_MANUAL_EXECUTION_ENABLED: "true"
  PAYMENT_MANUAL_EXECUTION_LIMIT_USD: "1000"
  PAYMENT_EXECUTION_DISABLED: "false"
  # app-secrets (not ConfigMap): META_APP_ID, META_APP_SECRET, META_WEBHOOK_VERIFY_TOKEN,
  # STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_CONNECT_CLIENT_ID,
  # WHATSAPP_OAUTH_REDIRECT_URI=https://staging.highvolt.tech/ledgerlink/auth/whatsapp/callback
  # WHATSAPP_OAUTH_FRONTEND_RETURN_URL=https://staging.highvolt.tech/ledgerlink/integrations
  # XERO_REDIRECT_URI=https://staging.highvolt.tech/ledgerlink/api/integrations/xero/callback
  # QUICKBOOKS_REDIRECT_URI=https://staging.highvolt.tech/ledgerlink/api/integrations/quickbooks/callback
  # ACCOUNTING_OAUTH_FRONTEND_RETURN_URL=https://staging.highvolt.tech/ledgerlink/integrations
  # app-secrets: XERO_CLIENT_ID, XERO_CLIENT_SECRET, QUICKBOOKS_CLIENT_ID, QUICKBOOKS_CLIENT_SECRET
