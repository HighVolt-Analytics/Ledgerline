server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # /ledgerlink -> /ledgerlink/ (preserves query string) for correct asset base URLs.
    location = /ledgerlink {
        return 301 /ledgerlink/$is_args$args;
    }

    # SPA under /ledgerlink: static files, then index.html for client routes (dashboard at /).
    location /ledgerlink/ {
        try_files $uri $uri/ /ledgerlink/index.html;
    }

    location / {
        return 404;
    }
}
