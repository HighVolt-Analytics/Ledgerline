server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Bare /ledgerlink -> /ledgerlink/ so relative asset URLs resolve correctly.
    location = /ledgerlink {
        return 301 /ledgerlink/;
    }

    # SPA under /ledgerlink: serve static files, fall back to index.html for client routes.
    location /ledgerlink/ {
        try_files $uri $uri/ /ledgerlink/index.html;
    }

    location / {
        return 404;
    }
}
