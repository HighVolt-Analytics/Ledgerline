server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Legacy manual deploy used /ledgerlink/* — redirect to root SPA paths.
    location = /ledgerlink {
        return 301 /;
    }

    location ^~ /ledgerlink/ {
        rewrite ^/ledgerlink(/.*)$ $1 permanent;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
