server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Legacy manual deploy used /ledgerlink/* — redirect to root SPA paths.
    location = /ledgerlink {
        return 301 /;
    }

    location ^~ /ledgerlink/ {
        rewrite ^/ledgerlink(/.*)$ $1 permanent;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
