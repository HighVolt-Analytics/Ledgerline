server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Serve SPA for bare /ledgerlink (no trailing slash) — same dashboard as /ledgerlink/
    location = /ledgerlink {
        try_files /ledgerlink/index.html =404;
    }

    # SPA under /ledgerlink/: static files, then index.html (dashboard index route)
    location /ledgerlink/ {
        try_files $uri $uri/ /ledgerlink/index.html;
    }

    location / {
        return 404;
    }
}
